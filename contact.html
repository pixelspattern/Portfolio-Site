<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Contact Information</title>
    <link rel="stylesheet" href="css/laptop.css">
    <link rel="stylesheet" href="css/tablet.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div id ="wrapper">
        <h1> Contact Me </h1>
        <div id ="banner">
        <form 
        action="mailto:matthew.kiprenko@Ontariotechu.net"
        method="post"
        enctype="text/plain"
        name="form">
        <p> 
            <label for="Fname"> First Name:</label>
            <input type="text" id="Fname" name="fname" size="32" required>

        </p>
        <p>
            <label for="Lname"> Last Name :</label>
            <input type="text" id="Lname" name="lname" size="32" required>
        </p>
        <p>
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" size="32" required>
            
        </p>
        <p>
            <label for="phone">Phone :</label>
            <input type="tel" id="phone" name="tel" size="32"
            pattern="[0-9]{3}[\-]?[0-9]{3}[\-]?[0-9]{4}"

            title="Enter a 10 digit phone number"
            required>
        </p>
        <p>
            <label for="comments">Comments:</label>
            <textarea id ="comments" name="comments" rows="4" cols="34" required></textarea>
        </p>
        <p>
            <button type="submit"> Submit </button>
        </p>
    </form>
    </div>
</div>

</html>
